<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ジャンルを選ぶ | 伝統工芸マッチング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/genre.css">
</head>

<body>

  <div class="genre-shell" id="genre-shell">

    <header class="top-bar" id="top-bar">
      <button id="openMenuBtn" class="icon-btn" aria-label="メニュー">☰</button>
      <div class="top-bar-actions">
        <a href="./html/favorites.html" class="icon-btn" aria-label="お気に入り">
          <img src="./images/Grocery Shelf.png" alt="">
        </a>
        <a href="./html/search.html" class="icon-btn" aria-label="検索">
          <img src="./images/search_icon.png" alt="">
        </a>
      </div>
    </header>

    <main class="genre-main">

      <div class="genre-scene" id="genre-scene">

        <!-- 四隅の模様（矢羽根＝赤、青海波＝白オレンジ） -->
        <span class="scene-pattern scene-pattern--chevron scene-pattern--tl"></span>
        <span class="scene-pattern scene-pattern--wave scene-pattern--tr"></span>
        <span class="scene-cloud scene-cloud--tl"></span>

        <span class="scene-pattern scene-pattern--wave scene-pattern--bl"></span>
        <span class="scene-pattern scene-pattern--chevron scene-pattern--br"></span>

        <!-- 浮雲：暖簾が開いた後にだけ現れる -->
        <span class="floating-cloud floating-cloud--1"></span>
        <span class="floating-cloud floating-cloud--2"></span>
        <!-- 器のシルエット（仮のプレースホルダーのまま。文字ラベルは削除） -->
        <!-- ジャンル選択：横並び・自動スクロール -->
        <div class="genre-scroll" id="genre-scroll">
          <div class="genre-track" id="genre-track">
            <!-- JSがここにボタンを生成します（2セット分） -->
          </div>
        </div>

      </div>


      <!-- のれん層：起動直後は揺れ、タップでくぐって開く -->
      <div class="noren-layer" id="noren-layer" aria-hidden="true">
        <div class="noren-leaves" id="noren-leaves">

          <div class="noren-leaf noren-leaf--left" id="leaf-left">
            <div class="noren-leaf-upper" id="leaf-left-upper">
              <span class="noren-pattern noren-pattern--seamA-left"></span>
              <span class="noren-cloud-pattern noren-cloud-pattern--seamD-left2"></span>
            </div>
            <div class="noren-leaf-lower" id="leaf-left-lower">
              <span class="noren-pattern noren-pattern--seamC-left"></span>
              <span class="noren-cloud-pattern noren-cloud-pattern--seamD-left"></span>
            </div>
          </div>

          <!-- PC版（幅1024px以上）だけで表示される追加パネル。
               スマホ版は今まで通り3枚のまま変化しない。 -->
          <div class="noren-leaf noren-leaf--mid-left" id="leaf-mid-left">
            <div class="noren-leaf-upper" id="leaf-mid-left-upper"></div>
            <div class="noren-leaf-lower" id="leaf-mid-left-lower"></div>
          </div>

          <div class="noren-leaf noren-leaf--center" id="leaf-center">
            <p class="noren-title">のれん</p>
            <div class="noren-leaf-upper" id="leaf-center-upper">
              <span class="noren-pattern noren-pattern--seamA-right"></span>
              <span class="noren-pattern noren-pattern--seamB-left"></span>
              <span class="noren-cloud-pattern noren-cloud-pattern--seamD-right2"></span>
            </div>
            <div class="noren-leaf-lower" id="leaf-center-lower">
              <span class="noren-pattern noren-pattern--seamB-left-lower"></span>
              <span class="noren-pattern noren-pattern--seamC-right"></span>
              <span class="noren-cloud-pattern noren-cloud-pattern--seamE-left"></span>
              <span class="noren-cloud-pattern noren-cloud-pattern--seamD-right"></span>
            </div>
          </div>

          <!-- PC版だけで表示される追加パネル -->
          <div class="noren-leaf noren-leaf--mid-right" id="leaf-mid-right">
            <div class="noren-leaf-upper" id="leaf-mid-right-upper"></div>
            <div class="noren-leaf-lower" id="leaf-mid-right-lower"></div>
          </div>

          <div class="noren-leaf noren-leaf--right" id="leaf-right">
            <div class="noren-leaf-upper" id="leaf-right-upper">
              <span class="noren-pattern noren-pattern--seamB-right"></span>
            </div>
            <div class="noren-leaf-lower" id="leaf-right-lower">
              <span class="noren-pattern noren-pattern--seamB-right-lower"></span>
              <span class="noren-cloud-pattern noren-cloud-pattern--seamE-right"></span>
            </div>
          </div>

        </div>
      </div>

    </main>

    <footer class="genre-footer" id="genre-footer">
      <button class="btn btn-outline genre-login-btn" id="omakase-btn">おまかせ</button>
    </footer>

  </div>

  <!-- 背景の黒幕 -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- ハンバーガーメニュー本体 -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="drawer-header">
      <button class="close-btn" id="closeMenuBtn">✕</button>
    </div>
    <!-- ログイン状態に応じてJS（auth-demo.js）がここを書き換える -->
    <ul class="drawer-nav-list" id="drawerNavList"></ul>

    <ul class="drawer-nav-list-bottom">
      <li>
        <a href="#" class="drawer-nav-item" id="languageBtn">
          <img src="./images/langage.png" alt="">
          <span>言語設定</span>
        </a>
      </li>
      <li>
        <a href="#" class="drawer-nav-item" id="fontSizeBtn">
          <span class="drawer-nav-icon" aria-hidden="true">Aa</span>
          <span>文字の大きさ</span>
        </a>
      </li>
      <li>
        <a href="#" class="drawer-nav-item">
          <img src="./images/setting.png" alt="">
          <span>その他設定</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- 文字の大きさ設定ポップアップ -->
  <div class="fontsize-modal-overlay" id="fontsizeModalOverlay">
    <div class="fontsize-modal" role="dialog" aria-modal="true">
      <div class="fontsize-modal-header">
        <h2>文字の大きさ</h2>
        <button class="fontsize-modal-close" id="fontsizeModalClose" aria-label="閉じる">✕</button>
      </div>
      <div class="fontsize-option-list" id="fontsizeOptionList"></div>
    </div>
  </div>

  <!-- 言語設定ポップアップ -->
  <div class="language-modal-overlay" id="languageModalOverlay">
    <div class="language-modal" role="dialog" aria-modal="true">
      <div class="language-modal-header">
        <h2>言語設定</h2>
        <button class="language-modal-close" id="languageModalClose" aria-label="閉じる">✕</button>
      </div>
      <p class="language-modal-note">
        言語を選ぶと、次回からその言語で表示されるよう準備を進めます。現在は日本語の内容のみのご案内となります。
      </p>
      <div class="language-option-list" id="languageOptionList"></div>
    </div>
  </div>

  <script>window.SITE_BASE = './';</script>
  <script src="./js/font-size.js"></script>
  <script src="./js/language.js"></script>
  <script src="./js/auth-demo.js"></script>
  <script src="./js/genre.js"></script>
</body>

</html>
