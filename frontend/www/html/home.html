<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホーム | 伝統工芸マッチング</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/card-modal.css">
</head>

<body>

  <div class="app-shell">

    <header class="top-bar">
      <button id="openMenuBtn" class="icon-btn" aria-label="メニュー">☰</button>
      <div class="top-bar-actions">
        <a href="../html/favorites.html" class="icon-btn" id="favoritesBtn" aria-label="お気に入り">
          <img src="../images/Grocery Shelf.png" alt="">
        </a>
        <a href="../html/search.html" class="icon-btn" aria-label="検索">
          <img src="../images/search_icon.png" alt="">
        </a>
      </div>
    </header>

    <!-- 右／左スワイプ中に画面端を色付けするフィードバック用オーバーレイ（カードより前面に表示） -->
    <div class="swipe-feedback-overlay swipe-feedback-overlay--like" id="like-overlay" aria-hidden="true">
      <img src="../images/swipe_icon.png" class="swipe-image--like" alt="">
      <span class="swipe-feedback-label">保存</span>
    </div>
    <div class="swipe-feedback-overlay swipe-feedback-overlay--skip" id="skip-overlay" aria-hidden="true">
      <img src="../images/swipe_icon.png" class="swipe-image--skip" alt="">
      <span class="swipe-feedback-label">飛ばす</span>
    </div>

    <main class="home-main">

      <!-- カードスタック（JSが中身を生成／タグはカードごとに個別に持つ） -->
      <div class="card-stack" id="card-stack"></div>

      <!-- スワイプ操作ボタン -->
      <div class="swipe-actions">
        <a href="../index.html" id="back-to-genre-btn" class="btn btn-outline genre-back-btn">
          <span aria-hidden="true">←</span> ジャンルへ戻る
        </a>
        <button id="skip-btn" class="btn btn-outline swipe-btn">✖</button>
        <button id="like-btn" class="btn btn-primary swipe-btn">❤︎</button>
      </div>

    </main>

  </div>

  <!-- ==== カード詳細ポップアップ ==== -->
  <div class="detail-modal-overlay" id="detail-modal-overlay">
    <div class="detail-modal" role="dialog" aria-modal="true">

      <div class="detail-modal-header">
        <button class="modal-icon-btn" id="modal-close-btn" aria-label="閉じる">✕</button>
        <button class="modal-icon-btn heart-btn" id="modal-heart-btn" aria-label="お気に入り">♥</button>
      </div>

      <div class="detail-modal-scroll">

        <div class="detail-modal-visual">
          <span class="pattern-blob pattern-blob--kikko pattern-blob--tl"></span>
          <span class="pattern-blob pattern-blob--wave pattern-blob--bl"></span>
          <span class="pattern-blob pattern-blob--kikko pattern-blob--br"></span>
          <div class="detail-modal-image" id="modal-image"></div>
        </div>

        <div class="detail-modal-body">
          <div class="tag" id="modal-tag">金工</div>
          <h2 class="detail-modal-title" id="modal-title">南部鉄器 鉄瓶</h2>
          <p class="card-sub" id="modal-region">岩手県</p>

          <div class="detail-stats" id="modal-stats"></div>

          <h3>この工芸品について</h3>
          <p id="modal-description"></p>

          <h3>特徴</h3>
          <div class="detail-tags" id="modal-tags"></div>

          <h3>この工芸品をつくる職人</h3>
          <a href="#" class="craftsman-preview">
            <div class="craftsman-avatar"></div>
            <div class="craftsman-info">
              <div class="craftsman-name" id="modal-craftsman-name"></div>
              <div class="card-sub" id="modal-craftsman-workshop"></div>
            </div>
            <span class="craftsman-arrow">›</span>
          </a>
        </div>

      </div>

      <div class="detail-modal-actions">
        <button id="modal-skip-btn" class="btn btn-outline swipe-btn-card">✕</button>
        <button id="modal-like-btn" class="btn btn-primary swipe-btn-card">♥</button>
      </div>

    </div>
  </div>
  <!-- 背景の黒幕 -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- ハンバーガーメニュー本体 -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="drawer-header">
      <button class="close-btn" id="closeMenuBtn">✕</button>
    </div>
    <!-- ログイン状態に応じてJS（auth-demo.js）がここを書き換える -->
    <ul class="drawer-nav-list" id="drawerNavList"></ul>

    <ul class="drawer-nav-list-bottom">
      <li>
        <a href="#" class="drawer-nav-item" id="languageBtn">
          <img src="../images/langage.png" alt="">
          <span>言語設定</span>
        </a>
      </li>
      <li>
        <a href="#" class="drawer-nav-item" id="fontSizeBtn">
          <span class="drawer-nav-icon" aria-hidden="true">Aa</span>
          <span>文字の大きさ</span>
        </a>
      </li>
      <li>
        <a href="../html/faq.html" class="drawer-nav-item">
          <img src="../images/faq.png" alt="">
          <span>FAQ</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- 文字の大きさ設定ポップアップ -->
  <div class="fontsize-modal-overlay" id="fontsizeModalOverlay">
    <div class="fontsize-modal" role="dialog" aria-modal="true">
      <div class="fontsize-modal-header">
        <h2>文字の大きさ</h2>
        <button class="fontsize-modal-close" id="fontsizeModalClose" aria-label="閉じる">✕</button>
      </div>
      <div class="fontsize-option-list" id="fontsizeOptionList"></div>
    </div>
  </div>

  <!-- 言語設定ポップアップ -->
  <div class="language-modal-overlay" id="languageModalOverlay">
    <div class="language-modal" role="dialog" aria-modal="true">
      <div class="language-modal-header">
        <h2>言語設定</h2>
        <button class="language-modal-close" id="languageModalClose" aria-label="閉じる">✕</button>
      </div>
      <p class="language-modal-note">
        言語を選ぶと、次回からその言語で表示されるよう準備を進めます。英訳がないものは日本語のままとなります。
      </p>
      <div class="language-option-list" id="languageOptionList"></div>
    </div>
  </div>

  <script>window.SITE_BASE = '../';</script>
  <script src="../js/font-size.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/auth-demo.js"></script>
  <script src="../js/home.js"></script>
  <script src="../js/card-modal.js"></script>
</body>

</html>
