<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お気に入り | 伝統工芸マッチング</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/card-modal.css">
    <link rel="stylesheet" href="../css/favorites.css">
</head>

<body>

    <div class="fav-shell" id="fav-shell">

        <header class="top-bar">
            <button id="openMenuBtn" class="icon-btn" aria-label="メニュー">☰</button>
            <button class="icon-btn" aria-label="検索">
                <img src="../images/search_icon.png" alt="">
            </button>
        </header>

        <div class="fav-hero">
            <span class="fav-hero-cloud fav-hero-cloud--tr"></span>
            <span class="fav-hero-cloud fav-hero-cloud--bm"></span>
            <span class="fav-hero-cloud fav-hero-cloud--bm2"></span>
            <h1 class="fav-hero-title">お気に入り</h1>
        </div>

        <main class="fav-main" id="fav-main">
            <!-- JSがここにタグごとのセクションを生成します -->
        </main>

        <div class="fav-add-wrap">
            <button class="fav-add-btn" id="fav-add-btn" aria-label="タグを追加">＋</button>
        </div>

    </div>

    <!-- タグ選択シート -->
    <div class="fav-tagsheet-overlay" id="fav-tagsheet-overlay">
        <div class="fav-tagsheet" role="dialog" aria-modal="true">
            <div class="fav-tagsheet-header">
                <h2>表示するタグを選ぶ</h2>
                <button class="modal-icon-btn" id="fav-tagsheet-close" aria-label="閉じる">✕</button>
            </div>
            <ul class="fav-tagsheet-list" id="fav-tagsheet-list"></ul>
        </div>
    </div>

    <!-- 作品詳細ポップアップ -->
    <div class="detail-modal-overlay" id="detail-modal-overlay">
        <div class="detail-modal" role="dialog" aria-modal="true">

            <div class="detail-modal-header">
                <button class="modal-icon-btn" id="modal-close-btn" aria-label="閉じる">✕</button>
                <button class="modal-icon-btn heart-btn liked" id="modal-heart-btn" aria-label="お気に入り">♥</button>
            </div>

            <div class="detail-modal-scroll">

                <div class="detail-modal-visual">
                    <span class="pattern-blob pattern-blob--kikko pattern-blob--tl"></span>
                    <span class="pattern-blob pattern-blob--wave pattern-blob--bl"></span>
                    <span class="pattern-blob pattern-blob--kikko pattern-blob--br"></span>
                    <div class="detail-modal-image" id="modal-image"></div>
                </div>

                <div class="detail-modal-body">
                    <div class="tag" id="modal-tag"></div>
                    <h2 class="detail-modal-title" id="modal-title"></h2>
                    <p class="card-sub" id="modal-region"></p>

                    <div class="detail-stats" id="modal-stats"></div>

                    <h3>この工芸品について</h3>
                    <p id="modal-description"></p>

                    <h3>特徴</h3>
                    <div class="detail-tags" id="modal-tags"></div>

                    <h3>この工芸品をつくる職人</h3>
                    <a href="#" class="craftsman-preview">
                        <div class="craftsman-avatar"></div>
                        <div class="craftsman-info">
                            <div class="craftsman-name" id="modal-craftsman-name"></div>
                            <div class="card-sub" id="modal-craftsman-workshop"></div>
                        </div>
                        <span class="craftsman-arrow">›</span>
                    </a>
                </div>

            </div>

        </div>
    </div>

    <!-- 背景の黒幕 -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- ハンバーガーメニュー本体 -->
    <nav class="drawer-menu" id="drawerMenu">
        <div class="drawer-header">
            <button class="close-btn" id="closeMenuBtn">✕</button>
        </div>
        <ul class="drawer-nav-list">
            <li><img src="../images/home.png" alt=""><a href="../html/home.html" class="drawer-nav-item active">ホーム</a></li>
            <li><img src="../images/login.png" alt="" style="width: 12%;"><a href="#" class="drawer-nav-item">ログイン</a>
            </li>
            <li><img src="../images/newuser.png" alt="" style="width: 10%;"><a href="#"
                    class="drawer-nav-item">初めてご利用の方へ</a></li>
        </ul>


        <ul class="drawer-nav-list-bottom">
            <li>
                <a href="#" class="drawer-nav-item active">
                    <img src="../images/langage.png" alt="">
                    <span>言語設定</span>
                </a>
            </li>
            <li style="display: flex;">
                <p style="width: fit-content; color: white; font-size: 1.5rem; margin: 0; line-height: 60px;">
                    <small>あ</small>あ</p>
                <a href="#" class="drawer-nav-item">文字の大きさ</a>
            </li>
            <li>
                <a href="#" class="drawer-nav-item">
                    <img src="../images/setting.png" alt="">
                    <span>その他設定</span>
                </a>
            </li>
        </ul>
    </nav>
    <script src="../js/favorites.js"></script>
</body>

</html>
