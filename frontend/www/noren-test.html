<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>のれん 図形テスト（境目をまたぐ模様×3）</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #222;
  }

  .noren-test-shell {
    position: relative;
    max-width: 430px;
    height: 100vh;
    margin: 0 auto;
    overflow: hidden;
    background: #000;
    cursor: pointer;

    --noren-color: #15335B;
    --noren-height: 78%;
    --noren-radius: 15px;

    --noren-split-1: 30;
    --noren-split-2: 70;

    --circle-size: 290px;
    --pattern-tile: 150px;

    transform-origin: 70% 55%;
    transform: scale(1);
    transition: transform 2s cubic-bezier(0.6, 0, 0.85, 1);
  }

  .noren-test-shell.is-zooming {
    transform: scale(9);
  }

  .noren-leaves {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: var(--noren-height);
    display: flex;
  }

  .noren-leaf {
    position: relative;
    flex: 0 0 auto;
    height: 100%;
    background-color: var(--noren-color);
    border-radius: 0 0 var(--noren-radius) var(--noren-radius);
    transform-origin: top center;
    will-change: transform;
    overflow: hidden;

    -webkit-mask-image: linear-gradient(to bottom, #000 100%, #000 100%);
    mask-image: linear-gradient(to bottom, #000 100%, #000 100%);
  }

  .noren-leaf--left {
    width: calc(var(--noren-split-1) * 1%);
  }

  .noren-leaf--center {
    width: calc((var(--noren-split-2) - var(--noren-split-1)) * 1%);
  }

  .noren-leaf--right {
    width: calc((100 - var(--noren-split-2)) * 1%);
  }

  /* ---- 青海波模様の円（共通スタイル） ---- */
  .noren-pattern {
    position: absolute;
    width: var(--circle-size);
    height: var(--circle-size);
    border-radius: 50%;
    background-image: url("images/noren-pattern.png");
    background-size: var(--pattern-tile) var(--pattern-tile);
    opacity: 0.25;
    pointer-events: none;
  }

  /* ---- 境目A（左｜中央・上寄り）をまたぐ円 ---- */
  .noren-pattern--seamA-left {
    top: -7%;
    right: calc(var(--circle-size) / -2.5);
    background-position: 0px 0px;
  }

  .noren-pattern--seamA-right {
    top: -7%;
    left: calc(var(--circle-size) / -1.6);
    background-position: 0px 0px;
  }

  /* ---- 境目B（中央｜右）をまたぐ円 ---- */
  .noren-pattern--seamB-left {
    top: 20%;
    right: calc(var(--circle-size) / -1.1);
    background-position: 40px 20px;
  }

  .noren-pattern--seamB-right {
    top: 20%;
    left: calc(var(--circle-size) / -7.5);
    background-position: 40px 20px;
  }

  /* ---- 境目C（左｜中央・下寄り）をまたぐ円 ---- */
  .noren-pattern--seamC-left {
    top: 65%;
    right: calc(var(--circle-size) / -1.5);
    background-position: 20px 20px;
  }

  .noren-pattern--seamC-right {
    top: 65%;
    left: calc(var(--circle-size) / -3);
    background-position: 20px 20px;
  }

  .noren-hint {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    color: #fbf1de;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

  <div class="noren-test-shell" id="noren-shell">
    <div class="noren-leaves" id="noren-leaves">

      <div class="noren-leaf noren-leaf--left" id="leaf-left">
        <span class="noren-pattern noren-pattern--seamA-left"></span>
        <span class="noren-pattern noren-pattern--seamC-left"></span>
      </div>

      <div class="noren-leaf noren-leaf--center" id="leaf-center">
        <span class="noren-pattern noren-pattern--seamA-right"></span>
        <span class="noren-pattern noren-pattern--seamB-left"></span>
        <span class="noren-pattern noren-pattern--seamC-right"></span>
      </div>

      <div class="noren-leaf noren-leaf--right" id="leaf-right">
        <span class="noren-pattern noren-pattern--seamB-right"></span>
      </div>

    </div>
    <p class="noren-hint">タップしてくぐる</p>
  </div>

  <script>
    (() => {
      "use strict";

      const shell = document.getElementById("noren-shell");

      const LEAVES = [
        {
          el: document.getElementById("leaf-left"),
          delayMs: 0,
          swayRight: 1.6, swayLeft: 10,
          skewRight: -3, skewLeft: 6,
        },
        {
          el: document.getElementById("leaf-center"),
          delayMs: 120,
          swayRight: 0.8, swayLeft: 6,
          skewRight: -1.5, skewLeft: 3.5,
        },
        {
          el: document.getElementById("leaf-right"),
          delayMs: 240,
          swayRight: 4, swayLeft: 7.5,
          skewRight: -2.5, skewLeft: 4.5,
        },
      ];

      const DURATION_MS = 2400;
      const TURN_POINT = 0.65;

      function easeInOutSine(t) {
        return -(Math.cos(Math.PI * t) - 1) / 2;
      }

      function swayFactor(phase) {
        if (phase < TURN_POINT) {
          return easeInOutSine(phase / TURN_POINT);
        }
        return 1 - easeInOutSine((phase - TURN_POINT) / (1 - TURN_POINT));
      }

      const GUST_PEAK = 1.7;
      const GUST_RAMP_MS = 350;
      const GUST_HOLD_MS = 450;
      const GUST_MIN_INTERVAL_MS = 4000;
      const GUST_MAX_INTERVAL_MS = 10000;

      let gustStartTime = null;

      function scheduleNextGust(now) {
        const wait =
          GUST_MIN_INTERVAL_MS +
          Math.random() * (GUST_MAX_INTERVAL_MS - GUST_MIN_INTERVAL_MS);
        gustStartTime = now + wait;
      }

      function easeOutSine(t) { return Math.sin((t * Math.PI) / 2); }
      function easeInSine(t) { return 1 - Math.cos((t * Math.PI) / 2); }

      function getGustMultiplier(now) {
        if (gustStartTime === null) return 1;
        const elapsed = now - gustStartTime;
        const totalMs = GUST_RAMP_MS * 2 + GUST_HOLD_MS;

        if (elapsed < 0) return 1;
        if (elapsed > totalMs) {
          scheduleNextGust(now);
          return 1;
        }
        if (elapsed < GUST_RAMP_MS) {
          const t = elapsed / GUST_RAMP_MS;
          return 1 + (GUST_PEAK - 1) * easeOutSine(t);
        }
        if (elapsed < GUST_RAMP_MS + GUST_HOLD_MS) {
          return GUST_PEAK;
        }
        const t = (elapsed - GUST_RAMP_MS - GUST_HOLD_MS) / GUST_RAMP_MS;
        return GUST_PEAK - (GUST_PEAK - 1) * easeInSine(t);
      }

      let isOpening = false;

      function tick(now) {
        if (isOpening) return;

        if (gustStartTime === null) scheduleNextGust(now);
        const gust = getGustMultiplier(now);

        for (const leaf of LEAVES) {
          const t = (now - leaf.delayMs) % DURATION_MS;
          const phase = ((t / DURATION_MS) + 1) % 1;
          const f = swayFactor(phase);

          const rotate =
            (-leaf.swayRight + (leaf.swayLeft - -leaf.swayRight) * f) * gust;
          const skew =
            (leaf.skewRight + (leaf.skewLeft - leaf.skewRight) * f) * gust;

          leaf.el.style.transform = `rotate(${rotate}deg) skewX(${skew}deg)`;
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);

      const leafLeft = document.getElementById("leaf-left");
      const leafCenter = document.getElementById("leaf-center");
      const leafRight = document.getElementById("leaf-right");

      function openNoren() {
        if (isOpening) return;
        isOpening = true;

        const OPEN_DURATION = "1.8s";
        const OPEN_EASE = "cubic-bezier(0.55, 0, 0.1, 1)";
        const FADE_MASK = "linear-gradient(to bottom, #000 50%, transparent 100%)";

        for (const el of [leafLeft, leafCenter]) {
          el.style.transition = `transform ${OPEN_DURATION} ${OPEN_EASE}, -webkit-mask-image 1.6s ease, mask-image 1.6s ease`;
          el.style.transform = "rotate(20deg)";
          el.style.webkitMaskImage = FADE_MASK;
          el.style.maskImage = FADE_MASK;
        }

        leafRight.style.transition = `transform ${OPEN_DURATION} ${OPEN_EASE}, -webkit-mask-image 1.6s ease, mask-image 1.6s ease`;
        leafRight.style.transform = "rotate(-10deg)";
        leafRight.style.webkitMaskImage = FADE_MASK;
        leafRight.style.maskImage = FADE_MASK;

        shell.classList.add("is-zooming");

        shell.addEventListener(
          "transitionend",
          (e) => {
            if (e.target === shell && e.propertyName === "transform") {
              shell.style.visibility = "hidden";

              // ↓↓↓ テスト用。本番では削除 ↓↓↓
              setTimeout(() => {
                location.reload();
              }, 1200);
              // ↑↑↑ ここまで ↑↑↑
            }
          },
          { once: true }
        );
      }

      shell.addEventListener("click", openNoren);
    })();
  </script>

</body>
</html>
